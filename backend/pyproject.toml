[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-backend"
version = "0.1.0"
description = "SUTRA — Secure Unified Threat & Relationship Analytics API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "neo4j>=5.24,<7.0",
    "alembic>=1.14,<2.0",
    "networkx>=3.3,<4.0",
    "rapidfuzz>=3.9,<4.0",
    "PyYAML>=6.0,<7.0",
    "joblib>=1.4,<2.0",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "black>=24.10,<26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
